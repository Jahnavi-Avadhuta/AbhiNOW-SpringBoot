version: '3.8'

services:

  # ── MySQL Database ──
  mysql:
    image: mysql:8.0
    container_name: abhinow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: abhinow_spring
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  # ── Spring Boot Backend ──
  backend:
    build:
      context: ./abhinow
    container_name: abhinow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/abhinow_spring?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000
    depends_on:
      mysql:
        condition: service_healthy

  # ── React Frontend ──
  frontend:
    build:
      context: ./abhinow-frontend
    container_name: abhinow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data: